# The shape of a portal.
#
# A portal is a block, one node thick, and every number here is in units of that
# block. The first four are POSITIONS, measured along the direction of travel
# from the face the player enters through: 0.0 is the face they come in at, 1.0
# is the face they come out of. The last two -- `view` and `clip` -- are
# DISTANCES from a plane each one names, and each says which.
#
# The engine reads this at startup and prints what it used. CNP_PORTAL_CONFIG
# or --portal-config PATH point it somewhere else.

# Where the image sits inside the block, and with it the plane the crossing is
# measured against, the plane a body is cut on, and the plane along which the
# two worlds are glued.
#   1.0  the far face: the whole block is a doorway seen from the approach side
#   0.5  the middle of the block
plane = 1.00

# Where the doorway's side faces begin. 0.0 is the near face of the block.
tunnel_start = 0.00

# How deep into the block the eye has to be for the crossing to fire.
trigger = 0.10

# How deep into the destination block the player is put, measured the same way:
# from the face they arrive through. 1.0 is the far face of that block, and
# values past it put the player in the open in front of the destination.
#
# This is a position, not an offset, and the value that costs nothing is not a
# free choice. The image the player is looking at is drawn by a map that glues
# the face they leave the source through to the face they emerge from at the
# destination -- those two offsets cancel -- and then looks `view` blocks
# further out. So the only exit that continues the picture is
#
#     exit = trigger + view
#
# -- as deep into the exit block as the trigger is into the entry block, plus
# the viewpoint offset. With trigger 0.10 and view 1.00 that is 1.10: a tenth of
# a node outside the exit block, which is exactly where the image was showing
# the player standing.
#
# It is set to that value, and the gates measure it rather than assume it:
# portal_crossing prints
#
#     the eye landed 0.0000 from where the opening was showing it
#
# and portal_orientation prints the frame of the crossing as 9 pixels of
# 2073600 changing -- 0.00% of the screen. The crossing is one picture.
exit = 1.10

# How far past the face the player emerges from the destination is LOOKED from,
# in blocks. 0 is that face itself, which is where it used to be.
#
# This is the only number here that is about what the opening SHOWS rather than
# where the opening is, and it is the only one that gives something up.
#
# At 0 the image is a true portal view: every ray through the opening is the ray
# a real hole would carry. It also puts the viewpoint one block INSIDE the
# destination's doorway whenever the player stands a block in front of the
# source's, so what the opening shows at walking distance is the inside of that
# doorway -- the other world's wall, seen from behind.
#
# At 1 the viewpoint is a block further out at every distance, the doorway seen
# through the opening is a block shallower, and the frames before a crossing
# show the area outside the destination instead of the tunnel into it.
#
# The cost, measured rather than claimed:
#   - the image is that picture taken a block ahead, so it is no longer what a
#     hole in the wall would show, and it does not line up with the world at the
#     opening's edges
#   - the crossing jumps by the distance between where the image put the eye and
#     where `exit` puts the body. With trigger 0.10 the image puts it at
#     view - trigger_depth; the seamless exit is therefore
#
#         exit = trigger + view
#
#     which with these numbers is 1.10 -- a tenth of a node OUTSIDE the exit
#     block. exit = 0.90 keeps the player inside it and pays 0.20 nodes of jump,
#     which portal_crossing prints every run.
view = 1.00

# What the doorway's side faces are made of.
#   1  a window: they show whatever is beside the destination's opening -- its
#      own wall if it has one, open sky if it does not
#   0  wall: painted flat, honest about being this world's wall and silent
#      about the other's
#
# The window widens the four lateral clip planes from the aperture at the image
# plane to the aperture at the doorway's mouth, because otherwise the render
# target holds nothing where these faces sample it. Every ray through the far
# aperture was already inside the wider cone, so what the opening itself shows
# does not change.
sides = 1

# Where the oblique near clipping plane goes: how far BEHIND the plane the map
# glues to -- the viewpoint above, `view` blocks past the exit face -- it sits,
# in blocks.
#
# The plane's job is to take the destination's own wall out from between the
# virtual camera and the opening, and it fails in both directions.
#
#   too small   the plane sits near the viewpoint and cuts too much: the
#               destination's ground goes along with its wall. The side faces,
#               asked what is beside the opening, find nothing in the render
#               target and come back clear colour. Reported from play as sky
#               around the edges of the portal.
#
#   too large   the plane sits too far back and the wall is left standing. It
#               gets drawn right against the virtual camera, the doorway's side
#               faces show it, and it is close enough to the geometry it is
#               painted on to fight it for depth. Reported from play as
#               z-fighting with the other world's wall.
#
# The value that keeps the rule is `plane - tunnel_start` -- one doorway behind
# the glued plane, which is what makes the tunnel the player walks down and the
# destination's own block the same volume rather than two. With this shape that
# is 1.00. Set it to anything else and the engine says so at startup.
#
# Measured, as the share of the pixels the opening paints that come out world
# B's clear colour, from a viewpoint off to one side (dual_session section 3):
#
#                        clip 0.00   clip 1.00   clip 2.00
#   looking level         17.04%       1.73%       0.00%
#   looking low           24.97%       0.00%       0.00%
#
# Level, the sky behind the destination's wall has to APPEAR: a wall still
# standing there covers it. Low, no sky is in frame at all, so anything that
# appears is a hole. The continuity gate reads 0.00% for all three columns --
# it compares the middle of the aperture, and this lives on the edge.
clip = 1.00

# one_way -- whether the portal exists at all from behind.
#
#   1   one way. From the back of the opening nothing is drawn and nothing is
#       rendered: no image, no doorway sides, and the target pass for that link
#       is skipped entirely. What is left where the portal was is the hole in
#       the wall it is carved into and whatever stands beyond that wall.
#
#   0   both ways. The opening is painted from either side, which is what it
#       used to do.
#
# This is the picture catching up with the body rather than a new rule. Crossing
# from behind was never possible: `entered_from_front` is set from the depth on
# the frame the player enters the trigger's bounds, so somebody arriving from
# the back never arms it. With the opening painted from both sides, a portal was
# something you could see through and could not walk through -- the two halves
# of the same object disagreeing about which way it works.
#
# Measured (dual_session section 10), as the pixels the opening paints against
# the same frame with no portal in it:
#
#                     from the front   from behind
#   one_way 1            169246            0
#   one_way 0            169246         168216
#
# and walking at it: from the front it crosses either way, from behind it
# crosses neither way.
#
# What it is worth. A portal seen from behind costs nothing at all now -- the
# skipped target pass is the whole world pass for that link. And it changes the
# SHAPE of recursion rather than trimming it: with two openings facing each
# other, every virtual camera stands behind the opening it is looking out
# through, so each level spawns one child instead of two. Passes go 2, 4, 6
# instead of 2, 6, 14 -- linear instead of exponential
# (portal_recursion measures both).
#
# The cost, said rather than discovered: from behind, a pair is a hole into
# whatever is behind the wall. In these scenes the slab is one node thick and
# the far side is open field, so what shows through is field -- correct, and
# less interesting than an image.
one_way = 1
