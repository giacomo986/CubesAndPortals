# Portals built out of blocks, as in yaportal: a rectangle of portal:frame round
# a hole of air, standing up or lying down, opens one of the world's two
# openings; a right click on the frame opens its menu. A ring of
# portal:server_frame is a portal to another server, set up by an admin.
name = portal
version = 0.1.0
api = 1
description = A frame of portal:frame blocks round a hole opens a portal; right click it to flip, turn or close it. A frame of portal:server_frame leads to a friend server, set up from an admin's right click.
entry = init.luau
capabilities =
