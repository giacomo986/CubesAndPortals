# The first mod that draws something.
#
# DESIGN.md 8 asks for "UI (microui/Clay guidata da Lua)" and every M7 finding
# so far has ended with "niente da Lua". This mod is what that sentence stops
# being true against: it declares a panel, the engine puts it on the screen, and
# the clicks come back as core:ui_click. Not one line of engine code knows this
# mod exists.
name = console
version = 0.1.0
api = 1
description = A panel declared entirely from Lua: a switch block opens it, its buttons build.
entry = init.luau
capabilities =
depends = spike
