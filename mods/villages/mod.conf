# Villages and towns, with streets inside them and paths between them.
#
# Depends on every mod with a mapgen stage, so its stage runs after theirs in
# each column: a house is built over the trees, the grass, the tunnels and the
# ruins, and clears them, rather than having them grow through it afterwards.
name = villages
version = 0.1.0
api = 1
description = Villages and towns of houses, farms and smithies along streets, joined to each other by paths.
entry = init.luau
capabilities =
depends = trees, woods, plants, gravel, rocks, timber, building, doors, torches, farm, lakes, chest, steps, craft, furnace, bed, cave, ore, cane, ruins, dungeons
