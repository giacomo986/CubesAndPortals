# A second mod, loaded into its own VM, to make "one VM per mod" a thing that
# runs rather than a claim. It asks for `os` -- the granted-capability path --
# where spike asks for nothing and cannot see that global at all.
name = beacons
version = 0.1.0
api = 1
description = Pillars that light on a guard alarm, in a VM of their own.
entry = init.luau
capabilities = os
memory_kb = 8192
depends = spike >= 0.2, guard
