# An add-on, not part of the game: a species for the player, the lizard man.
# Installed into the player's mods folder (~/.cubes-and-portals/mods), it is
# offered on the look page beside the game's own. It needs no other mod:
# its models are "robot:robot_lizard..." in any world, and a world whose player
# is a game's robot under another name ("track_core:robot") finds them there.
# `rooms = all`: given to the sandbox, the server loads it in every room, so
# whoever picked the lizard is the lizard in every world of the server.
name = lizard
version = 0.1.0
api = 1
description = The lizard man, a species for the player: a body made of cubes on the robot's skeleton, playing the robot's clips, with a tail that wags, three styles and the robot's extras fitted. Made with Meshy.
entry = init.luau
depends =
rooms = all
capabilities =
