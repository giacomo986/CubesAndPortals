# An add-on, not part of the game: a species for the player, the fox man.
# Installed into the player's mods folder (~/.cubes-and-portals/mods), it is
# offered on the look page beside the game's own. It needs no other mod:
# its models are "robot:robot_fox..." in any world, and a world whose player
# is a game's robot under another name ("track_core:robot") finds them there.
# `rooms = all`: given to the sandbox, the server loads it in every room, so
# whoever picked the fox is the fox in every world of the server.
name = fox
version = 0.1.0
api = 1
description = The fox man, a species for the player: a body of flat-coloured facets on the robot's skeleton, playing the robot's clips, with a bushy tail that wags, two styles and the robot's extras fitted. Made with Meshy.
entry = init.luau
depends =
rooms = all
capabilities =
